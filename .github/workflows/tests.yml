name: tests

on:
  push:
  pull_request:

jobs:
  rules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The rule tests use a stand-in for Laya, so torch and the model are not installed.
      - run: pip install --no-deps -e . && pip install pytest
      - run: pytest -q
